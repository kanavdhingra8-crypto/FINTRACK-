name: FinTrack CI and Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-test:
    name: ${{ matrix.service }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: auth-service
            directory: services/auth-service
          - service: transaction-service
            directory: services/transaction-service
          - service: notification-service
            directory: services/notification-service
          - service: gateway
            directory: gateway
          - service: frontend
            directory: frontend

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ${{ matrix.directory }}/package-lock.json

      - name: Install dependencies
        working-directory: ${{ matrix.directory }}
        run: npm ci

      - name: Lint
        working-directory: ${{ matrix.directory }}
        run: npm run lint

      - name: Test
        working-directory: ${{ matrix.directory }}
        run: npm test

      - name: Build frontend
        if: matrix.service == 'frontend'
        working-directory: frontend
        run: npm run build

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.directory }}
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          build-args: |
            VITE_API_URL=${{ vars.VITE_API_URL || 'http://localhost:4000/api' }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/fintrack-${{ matrix.service }}:latest
            ghcr.io/${{ github.repository_owner }}/fintrack-${{ matrix.service }}:${{ github.sha }}

  deploy:
    name: Trigger deployment
    needs: build-and-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Call optional deploy hook
        env:
          DEPLOY_HOOK_URL: ${{ secrets.DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$DEPLOY_HOOK_URL" ]; then
            echo "DEPLOY_HOOK_URL is not configured; skipping deployment hook."
            exit 0
          fi

          curl --fail --silent --show-error \
            --connect-timeout 10 --max-time 60 \
            --request POST "$DEPLOY_HOOK_URL"
